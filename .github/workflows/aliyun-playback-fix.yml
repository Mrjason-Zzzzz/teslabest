          diff --git a/src/lib/tesla-content-identity.ts b/src/lib/tesla-content-identity.ts
          new file mode 100644
          index 0000000..575303e
          --- /dev/null
          +++ b/src/lib/tesla-content-identity.ts
          @@ -0,0 +1,39 @@
          +import type { SearchResult } from './types';
          +
          +export function getVideoType(item: SearchResult): 'movie' | 'tv' {
          +  const type = item.type_name?.toLowerCase() || '';
          +  return type.includes('电影') || type.includes('movie') ? 'movie' : 'tv';
          +}
          +
          +// Fail closed: source ranking must never substitute a different programme.
          +export function sameContentTitle(expected: string, actual: string): boolean {
          +  const normalize = (value: string) =>
          +    value
          +      .normalize('NFKC')
          +      .replace(/[\s\u3000]/g, '')
          +      .replace(/[^\w\u4e00-\u9fa5]/g, '')
          +      .toLowerCase();
          +  const key = normalize(expected);
          +  return Boolean(key) && key === normalize(actual);
          +}
          +
          +export function filterSourcesForCurrentVideo(
          +  items: SearchResult[],
          +  title: string,
          +  year: string,
          +  type?: string
          +): SearchResult[] {
          +  return items.filter((item) => {
          +    if (!sameContentTitle(title, item.title)) return false;
          +    const itemYear = (item.year || '').trim();
          +    if (/^\d{4}$/.test(year) && /^\d{4}$/.test(itemYear) && itemYear !== year)
          +      return false;
          +    const typeName = item.type_name?.toLowerCase() || '';
          +    // Missing category is unknown, not proof of a different type.
          +    if (type && typeName) {
          +      const movie = typeName.includes('电影') || typeName.includes('movie');
          +      if ((type === 'movie') !== movie) return false;
          +    }
          +    return true;
          +  });
          +}
          diff --git a/src/lib/tesla-visual-watchdog.ts b/src/lib/tesla-visual-watchdog.ts
          new file mode 100644
          index 0000000..7f6efbd
          --- /dev/null
          +++ b/src/lib/tesla-visual-watchdog.ts
          @@ -0,0 +1,18 @@
          +// Only foreground observation time may establish a missing-video fault.
          +export class TeslaVisualWatchdog {
          +  private observedAt = 0;
          +  private mediaTime = 0;
          +
          +  reset(now: number, mediaTime: number) {
          +    this.observedAt = now;
          +    this.mediaTime = mediaTime;
          +  }
          +
          +  stalled(now: number, mediaTime: number, hidden: boolean): boolean {
          +    if (hidden) {
          +      this.reset(now, mediaTime);
          +      return false;
          +    }
          +    return now - this.observedAt > 6000 && mediaTime - this.mediaTime > 3;
          +  }
          +}
          diff --git a/src/lib/tesla-playback-guards.test.ts b/src/lib/tesla-playback-guards.test.ts
          new file mode 100644
          index 0000000..975a827
          --- /dev/null
          +++ b/src/lib/tesla-playback-guards.test.ts
          @@ -0,0 +1,66 @@
          +import {
          +  sameContentTitle,
          +  filterSourcesForCurrentVideo,
          +} from './tesla-content-identity';
          +import type { SearchResult } from './types';
          +import { TeslaVisualWatchdog } from './tesla-visual-watchdog';
          +
          +describe('content identity', () => {
          +  const result = (title: string, year = '2026', type_name = '电影') =>
          +    ({ title, year, type_name } as SearchResult);
          +  test('no matching film returns no candidates, never a popular unrelated result', () => {
          +    expect(
          +      filterSourcesForCurrentVideo(
          +        [result('2026微博音乐盛典'), result('同床异梦2')],
          +        '年会不能停！2',
          +        '2026',
          +        'movie'
          +      )
          +    ).toEqual([]);
          +  });
          +  test('rejects explicit year/category mismatch and retains matching film', () => {
          +    const correct = result('年会不能停！2');
          +    expect(
          +      filterSourcesForCurrentVideo(
          +        [
          +          result('年会不能停！2', '2025'),
          +          result('年会不能停！2', '2026', '综艺'),
          +          correct,
          +        ],
          +        '年会不能停！2',
          +        '2026',
          +        'movie'
          +      )
          +    ).toEqual([correct]);
          +  });
          +  test.each(['2026微博音乐盛典', '同床异梦2', '年会不能停！'])(
          +    'rejects %s',
          +    (title) => {
          +      expect(sameContentTitle('年会不能停！2', title)).toBe(false);
          +    }
          +  );
          +  test('accepts punctuation and fullwidth differences, not empty titles', () => {
          +    expect(sameContentTitle('年会不能停！2', '年会不能停!２')).toBe(true);
          +    expect(sameContentTitle('', '')).toBe(false);
          +  });
          +});
          +
          +describe('foreground frame observation', () => {
          +  test('background audio advancement is not a video failure', () => {
          +    const guard = new TeslaVisualWatchdog();
          +    guard.reset(0, 0);
          +    expect(guard.stalled(60000, 60, true)).toBe(false);
          +    // visibilitychange resets observation even if hidden timers never ran.
          +    guard.reset(120000, 120);
          +    expect(guard.stalled(120001, 120, false)).toBe(false);
          +    expect(guard.stalled(125000, 125, false)).toBe(false);
          +    expect(guard.stalled(129000, 129, false)).toBe(true);
          +  });
          +  test('presented frames and paused media do not trigger a fault', () => {
          +    const guard = new TeslaVisualWatchdog();
          +    guard.reset(10000, 10);
          +    expect(guard.stalled(30000, 10, false)).toBe(false);
          +    guard.reset(30000, 30);
          +    expect(guard.stalled(31000, 31, false)).toBe(false);
          +  });
          +});
