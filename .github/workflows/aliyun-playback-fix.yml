name: Build Aliyun Playback Fix

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/aliyun-playback-fix.yml"

permissions:
  contents: read

concurrency:
  group: aliyun-playback-fix
  cancel-in-progress: false

