<!DOCTYPE html>
<html style="margin:0;padding:0;width:100%;height:100%;background:#000;">
<body style="margin:0;padding:0;width:100%;height:100%;">
    <video id="v" controls autoplay style="width:100%;height:100%;object-fit:contain;"></video>
    
    <script>
        const params = new URLSearchParams(window.location.search);
        const url = params.get('url');
        const v = document.getElementById('v');
        
        console.log("检测到URL:", url);
        
        if (url) {
            v.src = url;
        } else {
            document.body.innerHTML = "<h1 style='color:red'>错误：未传URL参数</h1>";
        }
        
        v.onerror = (e) => {
            console.error("播放错误:", e);
            alert("播放源错误，请检查控制台");
        };
    </script>
</body>
</html>
