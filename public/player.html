<!DOCTYPE html>
<html style="margin:0;padding:0;width:100%;height:100%;background:#000;">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body style="margin:0;padding:0;width:100%;height:100%;">
    <video id="video" controls autoplay style="width:100%;height:100%;object-fit:contain;"></video>
    
    <script>
        const video = document.getElementById('video');
        const params = new URLSearchParams(window.location.search);
        const url = params.get('url');
        
        if (!url) {
            document.body.innerHTML = "<h1 style='color:red; text-align:center;'>错误：未获取到视频地址</h1>";
        } else {
            console.log("尝试播放:", url);
            
            // 检查浏览器是否支持 HLS
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.error("自动播放被拦截:", e));
                });
                
                // 监听具体错误，这样你就不会只看到“播放错误: Event”了
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        console.error("致命错误:", data.type, data.details);
                        alert("播放崩溃: " + data.details);
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // 原生支持 HLS 的浏览器（如 Safari）
                video.src = url;
            } else {
                alert("当前浏览器不支持 HLS 播放");
            }
        }
    </script>
</body>
</html>
